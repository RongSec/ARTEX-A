# 单机部署（镜像来自 Docker Hub，网络用 host）。
#
# 首次部署：
#   bash docker/init-env.sh
#   docker compose -f docker/docker-compose.hs.yml up -d
#
# 口令与密钥只存在于本机 docker/.env（0600，已在 .gitignore）。
# 本文件刻意不放任何真实口令——之前这里写死过数据库密码，属于事故。
name: artex-hs

services:
  artex-hs:
    image: ${ARTEX_IMAGE:-rongsec/artex-a:latest}
    container_name: ${ARTEX_CONTAINER_NAME:-artex-hs}
    network_mode: host
    environment:
      ARTEX_PG_DSN: "${ARTEX_PG_DSN:?缺少 ARTEX_PG_DSN：先运行 bash docker/init-env.sh，或按实际数据库改 docker/.env}"
      # 仅首次启动建管理员（用户名 ARTEX）；之后改这里无效，去页面改密码。
      ARTEX_INIT_PASSWORD: "${ARTEX_INIT_PASSWORD:-}"
      ARTEX_LISTEN_ADDR: "${ARTEX_LISTEN_ADDR:-:8801}"
      ARTEX_PROXY_ADDR: "${ARTEX_PROXY_ADDR:-127.0.0.1:8802}"
      # go / pip 类工具落到挂载卷：重建容器不丢，升级镜像也不用重装。
      ARTEX_HOSTBIN: "/app/data/hostbin"
      ARTEX_HOSTPY: "/app/data/pyenv"
      GOBIN: "/app/data/hostbin"
      GOPATH: "/app/data/gopath"
      GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"
      HOME: "/app/data/home"
      TZ: "${TZ:-Asia/Shanghai}"
      NUCLEI_DISABLE_UPDATE_CHECK: "true"
    volumes:
      # data 整个挂上去：模板、hostbin、pyenv、报告产物全在卷里。
      - ${ARTEX_DATA_DIR:-./data}:/app/data
      # 字典（只读）：ffuf/gobuster 等直接指 /usr/share/wordlists。
      - ${ARTEX_WORDLISTS_DIR:-./data/wordlists}:/usr/share/wordlists:ro
    command: ["-addr", "${ARTEX_LISTEN_ADDR:-:8801}", "-proxy", "${ARTEX_PROXY_ADDR:-127.0.0.1:8802}"]
    restart: unless-stopped
