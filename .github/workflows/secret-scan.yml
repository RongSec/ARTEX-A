name: secret-scan

# 兜底闸门：仓库里出现过写死的数据库口令（docker-compose.hs.yml），
# 靠人肉 review 不可靠。这里只做「高置信度模式」扫描——不追求覆盖全部，
# 追求零误报，免得每次提交都被大量无关告警淹没而失去意义。
on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for credentials
        run: |
          set -e
          pat='ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{60,}|sk-[A-Za-z0-9]{32,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -InE "$pat" -- . ; then
            echo "::error::发现疑似凭据（上面列出的文件与行号），请改为环境变量/数据库设置后再提交。"
            exit 1
          fi
          echo "未发现疑似凭据"
      - name: Ensure deploy env files are not tracked
        run: |
          set -e
          for f in docker/.env .env config.json jwt.key; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f 被提交进仓库了（含口令/密钥），请 git rm --cached 并加进 .gitignore。"
              exit 1
            fi
          done
          echo "敏感文件均未被跟踪"
