name: secret-scan

# 兜底闸门。三道：
#   ① scripts/scan_repo_secrets.py —— 路径黑名单 + 凭据 + 机构标识 + 手机号
#      + 部署网段；文本/docx/xlsx/二进制都扫。本地 pre-commit 用同一份脚本。
#   ② git grep 高置信度凭据 —— 覆盖脚本正则没写到的格式。
#   ③ 部署环境文件不得被跟踪。
#
# 为什么需要脚本而不只是 git grep：git grep 默认跳过二进制，docx 里的手机号
# 扫不到；2026-11-26 的真实报告模板就是这样漏出去的（已重写历史 + 删库重建）。
on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 敏感内容扫描（路径 + 凭据 + 标识 + 网段）
        run: python scripts/scan_repo_secrets.py

      - name: 高置信度凭据正则
        run: |
          set -e
          pat='ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{60,}|sk-[A-Za-z0-9]{32,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -InE "$pat" -- . ; then
            echo "::error::发现疑似凭据（上面列出的文件与行号），请改为环境变量/数据库设置后再提交。"
            exit 1
          fi
          echo "未发现疑似凭据"

      - name: 部署环境文件不得被跟踪
        run: |
          set -e
          for f in docker/.env .env config.json jwt.key; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f 被提交进仓库了（含口令/密钥），请 git rm --cached 并加进 .gitignore。"
              exit 1
            fi
          done
          echo "敏感文件均未被跟踪"
